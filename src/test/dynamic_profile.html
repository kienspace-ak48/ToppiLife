<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Testimonial Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f5fafb;
      padding: 20px;
    }
    .customer-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .customer-card .remove-card {
      position: absolute;
      top: 8px;
      right: 10px;
      border: none;
      background: none;
      color: #dc3545;
      font-size: 20px;
      cursor: pointer;
    }
    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="mb-4">🗣️ Form nhập cảm nhận khách hàng (Dynamic)</h3>

    <button id="btnAddCustomer" class="btn btn-primary mb-3">+ Thêm khách hàng</button>
    <button id="btnGetData" class="btn btn-success mb-3 ms-2">💾 Lấy dữ liệu</button>

    <div class="customers-container"></div>
  </div>

  <!-- Template -->
  <script type="text/template" id="customerTemplate">
    <div class="customer-card">
      <button type="button" class="remove-card">&times;</button>

      <div class="row">
        <div class="col-md-3 text-center">
          <div class="avatar-preview mb-2">
            <img src="https://placehold.co/80x80?text=Avatar" alt="avatar">
          </div>
          <input type="text" class="form-control form-control-sm avatar-url" placeholder="URL ảnh đại diện" />
        </div>
        <div class="col-md-9">
          <input type="text" class="form-control mb-2 name" placeholder="Tên khách hàng (vd: Tuấn)" />
          <input type="text" class="form-control mb-2 job" placeholder="Chức vụ (vd: Lập trình viên)" />
          <input type="number" class="form-control mb-2 age" placeholder="Tuổi" />
          <textarea class="form-control quote" rows="3" placeholder="Nhập lời chia sẻ..."></textarea>
        </div>
      </div>
    </div>
  </script>

  <script>
    const btnAddCustomer = document.getElementById("btnAddCustomer");
    const customersContainer = document.querySelector(".customers-container");
    const template = document.getElementById("customerTemplate").innerHTML;

    // Thêm khách hàng mới
    btnAddCustomer.addEventListener("click", () => {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = template.trim();
      const card = wrapper.firstElementChild;

      // Xóa card
      card.querySelector(".remove-card").addEventListener("click", () => card.remove());

      // Cập nhật ảnh preview khi nhập URL
      const avatarInput = card.querySelector(".avatar-url");
      avatarInput.addEventListener("input", () => {
        const previewImg = card.querySelector(".avatar-preview img");
        previewImg.src = avatarInput.value.trim() || "https://placehold.co/80x80?text=Avatar";
      });

      customersContainer.appendChild(card);
    });

    // Lấy dữ liệu
    document.getElementById("btnGetData").addEventListener("click", () => {
      const cards = document.querySelectorAll(".customer-card");
      const data = Array.from(cards).map(card => ({
        avatar: card.querySelector(".avatar-url").value.trim(),
        name: card.querySelector(".name").value.trim(),
        job: card.querySelector(".job").value.trim(),
        age: card.querySelector(".age").value.trim(),
        quote: card.querySelector(".quote").value.trim()
      }));

      console.log(data);
      alert("✅ Dữ liệu đã log ra console!");
    });
  </script>
</body>
</html>
